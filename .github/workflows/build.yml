
name: Build BANANA BLAST

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find project and scheme
        run: |
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" -print -quit)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          xcodebuild -list -json -project "$PROJECT" > xcode-list.json
          SCHEME=$(python3 -c "import json; d=json.load(open('xcode-list.json')); print(d['project']['schemes'][0])")
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build iOS app
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          cd "$(dirname "$APP")"
          zip -r "$GITHUB_WORKSPACE/BANANA-BLAST-unsigned.zip" "$(basename "$APP")"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BANANA-BLAST-unsigned
          path: BANANA-BLAST-unsigned.zip
