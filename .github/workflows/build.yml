
name: Build BANANA BLAST IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project BANANA-BLAST.xcodeproj \
            -scheme BANANA-BLAST \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BANANA-BLAST.app Payload/
          zip -r BANANA-BLAST.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BANANA-BLAST-IPA
          path: BANANA-BLAST.ipa
